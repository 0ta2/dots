[settings]
env_shell_expand = true

[vars]
source = '~/ghq/github.com/0ta2/dots'
brewfile = "${BREWFILE}"

#
# chemoi
#
[tasks."chezmoi:add"]
description = "chezmoi管理下に置くファイルを追加"
run = "chezmoi --source={{vars.source}} add"

[tasks."chezmoi:template"]
description = "chezmoiに管理下に置くファイルをテンプレートとして管理する"
run = "chezmoi --source={{vars.source}} chattr template"

[tasks."chezmoi:apply"]
description = "chezmoiの反映"
run = "chezmoi --source={{vars.source}} apply"

[tasks."chezmoi:diff"]
description = "chezmoiの差分確認"
run = "chezmoi --source={{vars.source}} diff"

[tasks."chezmoi:status"]
description = "chezmoiのstatus確認"
run = "chezmoi --source={{vars.source}} status"

#
# homebrew
#
[tasks."brew:sync"]
description = "Brewのsync"
run = [
    "brew bundle cleanup --install --force --file={{vars.brewfile}}",
]


[tasks."install"]
description = "初回セットアップ一式 (chezmoi適用 → mise tools → brew/skill/plugin/uv)"
run = [
    "mise run chezmoi:apply",
    "mise install",
    "mise run brew:sync",
    "mise run skill:install",
    "mise run plugin:install",
    "mise run herdr:plugin:install",
    "mise run uv:tools:install",
]

[tasks."update"]
description = "全ツールの更新 (chezmoi/brew/mise/skill/uv tool/herdr plugin)"
run = [
    "mise run chezmoi:apply",
    "brew upgrade",
    "brew update",
    "mise upgrade",
    "mise run skill:update",
    "uv tool upgrade --all",
    "mise run herdr:plugin:install",
]

[tasks."skill:install"]
description = "スキルのインストール (ネイティブ plugin 経路が無いものだけをここで管理する)"
run = """
npx --yes skills add herdrdev/herdr --skill herdr --global \
    --agent claude-code --agent codex --yes
"""

[tasks."skill:update"]
description = "スキルの更新"
run = [
    "npx --yes skills update --global --yes",
]

[tasks."plugin:install"]
description = "Claude Code / Codex の plugin インストール"
run = """
# Claude Code: 対象は dot_claude/settings.json の enabledPlugins が正 (chezmoi:apply の後に実行する)
jq -r '.enabledPlugins | to_entries[] | select(.value) | .key' ~/.claude/settings.json \
    | xargs -n1 claude plugin install
# Codex: openai-primary-runtime/openai-bundled 系のデフォルト plugin は codex login 後に
# アプリ自身が有効化するため対象外。ここでは能動的に入れた追加分のみを列挙する
# (要 codex login 済み。未ログインだと marketplace が見えず not found になる)
codex plugin add superpowers@openai-curated
codex plugin marketplace add heptameta/heptabase-cli-skills
codex plugin add heptabase@heptabase-cli-skills
"""

[tasks."herdr:plugin:install"]
description = "herdr の plugin インストール"
run = """
herdr plugin install crafts69guy/herdr-ghq --yes
herdr plugin install smarzban/herdr-file-viewer --yes
"""

[tasks."uv:tools:install"]
description = "uv tool install で管理する Python CLI ツール群"
run = "uv tool install --python 3.13 'headroom-ai[all]'"
